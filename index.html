<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niños rata.com</title>
    <link rel="icon" type="image/png" href="assets/web/favicon.png">
    <link rel="stylesheet" href="code/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

    <!-- Encabezado con Logo Principal -->
    <div class="board-header">
        <img src="assets/web/logo.png" alt="Logo" class="board-logo" onerror="this.style.display='none'">
    </div>

    <!-- Barra de Navegación -->
    <div class="navbar">
        <a id="nav-login-btn" onclick="focusLogin()">[Login]</a>
    </div>

    <!-- Contenedor Principal -->
    <div class="main-container">

        <!-- LOGIN / REGISTRO -->
        <div class="box-container" id="auth-box">
            <div class="account-brand-header">
                <img src="assets/web/PattitexTECaccounts.png" alt="PattitexTEC Accounts" class="account-brand-logo" onerror="this.style.display='none'">
            </div>
            <form onsubmit="return false;">
                <table>
                    <tr>
                        <td style="width: 80px;">Correo:</td>
                        <td><input type="text" id="email" placeholder="correo@ejemplo.com" required></td>
                    </tr>
                    <tr>
                        <td>Contraseña:</td>
                        <td><input type="text" id="password" placeholder="Escribe tu contraseña..." required></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td style="padding-top: 5px;">
                            <button type="button" class="btn-chan" onclick="handleSignIn()">Entrar</button>
                            <button type="button" class="btn-chan" onclick="handleSignUp()">Crear Cuenta</button>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center">
                            <div id="status-msg"></div>
                        </td>
                    </tr>
                </table>
            </form>
        </div>

        <!-- PANEL DE USUARIO CON BOTÓN [+] Y BOTÓN DE CIERRE -->
        <div class="box-container" id="post-box" style="display: none;">
            <div style="margin-bottom: 10px; border-bottom: 1px solid #aaa; padding-bottom: 5px; text-align: center; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <button class="btn-chan" onclick="togglePublishBox()">[+] Crear Post</button>
                    <button class="btn-chan" onclick="verTab('perfil')">[Información del Perfil]</button>
                    <button class="btn-chan" onclick="solicitarPermisoNotificaciones()">[🔔 Notificaciones]</button>
                </div>
                <div>
                    <button class="btn-chan" id="btn-cerrar-post" onclick="cerrarCajaPost()" style="background: #2b2b2b; color: #fff; display: none;">[X]</button>
                </div>
            </div>

            <!-- TAB 1: FORMULARIO DE PUBLICACIÓN -->
            <div id="tab-publicar" style="display: none;">
                <form onsubmit="return false;">
                    <table>
                        <tr>
                            <td colspan="2" style="font-weight: bold; padding-bottom: 5px;">
                                Publicando como: <span id="current-user-display" class="postername"></span>
                            </td>
                        </tr>
                        <tr>
                            <td style="width: 110px; font-weight: bold;">SubRatita (SR):</td>
                            <td>
                                <select id="p-subratita" style="font-weight: bold; color: #006600; font-family: monospace; font-size: 11px; padding: 2px;" required>
                                    <option value="" disabled selected>-- Selecciona un SubForum --</option>
                                    <option value="general">sr/general</option>
                                    <option value="programacion">sr/programacion</option>
                                    <option value="dudas">sr/dudas</option>
                                    <option value="shitpost">sr/shitpost</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" style="padding-top: 5px; text-align: center;">
                                <div class="g-recaptcha" data-sitekey="6LcxugAuAAAAAEJToFOncXfxee4n4v3Wb6zqqD8N" style="display: inline-block; transform:scale(0.85); transform-origin:0 0;"></div>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" style="padding-top: 5px;">
                                <textarea id="p-content" rows="3" maxlength="500" placeholder="Escribe tu publicación (máx. 500 caracteres)..." oninput="actualizarContador()" required></textarea>
                                <div class="char-counter" id="char-counter">500 / 500</div>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" style="padding-top: 5px; text-align: right;">
                                <button type="button" class="btn-chan" onclick="enviarPost()">Publicar</button>
                                <button type="button" class="btn-chan" onclick="handleSignOut()">Cerrar Sesión</button>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" align="center">
                                <div id="post-status"></div>
                            </td>
                        </tr>
                    </table>
                </form>
            </div>

            <!-- TAB 2: DETALLES DEL PERFIL -->
            <div id="tab-perfil" style="display: none;">
                <div class="account-brand-header">
                    <img src="assets/web/PattitexTECaccounts.png" alt="PattitexTEC Accounts" class="account-brand-logo" onerror="this.style.display='none'">
                </div>
                <div style="font-weight: bold; margin-bottom: 8px; color: #1b3d1b; border-bottom: 1px dashed #999; padding-bottom: 3px;">
                    📋 Detalles de la Cuenta (ur/)
                </div>
                <table style="width: 100%; font-size: 11px; line-height: 1.6;">
                    <tr>
                        <td style="width: 110px; font-weight: bold;">Usuario (ur/):</td>
                        <td id="profile-username" class="postername">-</td>
                    </tr>
                    <tr>
                        <td style="font-weight: bold;">Correo:</td>
                        <td id="profile-email">-</td>
                    </tr>
                    <tr>
                        <td style="font-weight: bold;">ID de Usuario:</td>
                        <td id="profile-id" style="font-family: monospace; font-size: 10px; color: #444;">-</td>
                    </tr>
                    <tr>
                        <td style="font-weight: bold;">Último Acceso:</td>
                        <td id="profile-last-login">-</td>
                    </tr>
                </table>
                <div style="margin-top: 10px; text-align: right;">
                    <button type="button" class="btn-chan" onclick="handleSignOut()">Cerrar Sesión</button>
                </div>
            </div>
        </div>

        <!-- BARRA DE NAVEGACIÓN DE SUBRATITAS Y BÚSQUEDA -->
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 5px; margin: 10px 0;">
            <div id="subratitas-nav" style="display: flex; gap: 4px; flex-wrap: wrap;">
                <!-- Se llena dinámicamente con JS -->
            </div>
            <div>
                <input type="text" id="search-input" placeholder="🔍 Buscar..." oninput="filtrarPosts()" style="width: 160px; font-size: 11px; padding: 3px;">
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #aaa; margin: 10px 0;">

        <!-- FEED DE POSTS Y COMENTARIOS -->
        <div class="thread" id="feed">
            <div style="text-align:center; font-size:11px;">Cargando publicaciones...</div>
        </div>
    </div>

    <div class="footer">
        Niños rata.com
    </div>

    <!-- Script único -->
    <script src="code/main.js"></script>
</body>
</html>
